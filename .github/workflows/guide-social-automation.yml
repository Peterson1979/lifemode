
name: Guide Social Automation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Allow live publishing to social platforms (MUST be explicitly true to publish)'
        type: boolean
        default: false
      dry_run:
        description: 'Execute in safe dry-run mode (no external publishing, no history writes)'
        type: boolean
        default: true
      allow_push:
        description: 'Allow pushing publication history to remote master branch'
        type: boolean
        default: false

concurrency:
  group: guide-social-automation
  cancel-in-progress: false

jobs:
  run-guide-social:
    name: Run Guide Social Automation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git Identity
        run: |
          git config user.name "LifeMode Guide Social Automation"
          git config user.email "social-automation@lifemode.local"

      - name: Execute Guide Social Automation
        env:
          # AI Router & Provider Credentials
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Cloudflare Workers AI & Image Credentials
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_API_KEY: ${{ secrets.CLOUDFLARE_IMAGE_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Cloudflare R2 Master Asset Storage
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

          # Social Platform Credentials
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID || '495607202683261049' }}
          EVERYDAY_PINTEREST_ACCESS_TOKEN: ${{ secrets.EVERYDAY_PINTEREST_ACCESS_TOKEN }}
          EVERYDAY_PINTEREST_BOARD_ID: ${{ secrets.EVERYDAY_PINTEREST_BOARD_ID || '1033646620665404418' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID || '28272717349017680' }}

          # Social Automation Runtime Settings
          LIFEMODE_SOCIAL_ENABLED: "true"
          LIFEMODE_SOCIAL_PUBLISH: ${{ inputs.publish == true && inputs.dry_run == false && 'true' || 'false' }}
          LIFEMODE_SOCIAL_DRY_RUN: ${{ (inputs.dry_run == true || inputs.publish == false) && 'true' || 'false' }}
          LIFEMODE_SOCIAL_COMMIT: ${{ inputs.publish == true && inputs.dry_run == false && inputs.allow_push == true && 'true' || 'false' }}
          LIFEMODE_SOCIAL_PUSH: ${{ inputs.publish == true && inputs.dry_run == false && inputs.allow_push == true && 'true' || 'false' }}
          LIFEMODE_SOCIAL_PROVIDER: "router"
          LIFEMODE_SOCIAL_GIT_REMOTE: "origin"
          LIFEMODE_SOCIAL_GIT_BRANCH: "master"

          # Per-run artifacts
          GUIDE_SOCIAL_ARTIFACT_DIR: artifacts/guide-social-current

        run: |
          set -euo pipefail

          ARTIFACT_DIR="artifacts/guide-social-current"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS="--publish"
            if [ "${{ inputs.allow_push }}" = "true" ]; then
              ARGS="$ARGS --push --commit"
            fi
          else
            ARGS="--dry-run"
          fi

          npx tsx scripts/run-guide-social.ts $ARGS --json | tee "$ARTIFACT_DIR/result.json"

      - name: Prepare Current Run Artifact
        if: always()
        run: |
          mkdir -p artifacts/guide-social-current

          if [ ! -f artifacts/guide-social-current/result.json ]; then
            printf '{"runId":"%s","status":"NO_RESULT","message":"Check workflow logs for the failure details."}\n' \
              "$GITHUB_RUN_ID" > artifacts/guide-social-current/result.json
          fi

          if [ ! -f artifacts/guide-social-current/manifest.json ]; then
            printf '{"runId":"%s","status":"NO_MANIFEST","entries":[]}\n' \
              "$GITHUB_RUN_ID" > artifacts/guide-social-current/manifest.json
          fi

      - name: Upload Guide Social Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-social-manifest
          path: artifacts/guide-social-current/
          if-no-files-found: warn
          retention-days: 30
